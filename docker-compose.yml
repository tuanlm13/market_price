services:

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - browser_profiles:/app/browser_profiles
    environment:
      - DATABASE_URL=postgresql://tracker:tracker@db:5432/pricetracker
      - SECRET_KEY=${SECRET_KEY}
      - GMAIL_ADDRESS=${GMAIL_ADDRESS}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-true}
      - BROWSER_PROFILES_DIR=/app/browser_profiles
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_BOT_TOKEN_RAM=${TELEGRAM_BOT_TOKEN_RAM:-}
      - TELEGRAM_CHAT_ID_RAM=${TELEGRAM_CHAT_ID_RAM:-}
      - COLLECTOR_INTERVAL_FB_GROUPS=${COLLECTOR_INTERVAL_FB_GROUPS:-15}
      - COLLECTOR_QUERY_FB_GROUPS=${COLLECTOR_QUERY_FB_GROUPS:-ram}
      - MOCK_TELEGRAM=${MOCK_TELEGRAM:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: pricetracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d pricetracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  browser_profiles:
